<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tienda DW</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">

  <div class="login">
    <div class="login-lado">
      <span class="logo-cuadro">DW</span>
      <h1>Tienda DW</h1>
      <p>Compra tus productos favoritos de forma fácil y rápida.</p>
    </div>

    <div class="login-form">
      <h2>Iniciar sesión</h2>
      <p class="subtitulo">Ingresa con tu correo y contraseña</p>

      <form id="formLogin" novalidate>
        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" placeholder="Tu contraseña">

        <button type="submit">Ingresar</button>
      </form>

      <p id="mensaje" class="mensaje"></p>

      <p class="texto-centro">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
      <p class="nota">Admin de prueba: admin@admin.com / 123456</p>
    </div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
