<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Tienda DW</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">

  <div class="login">
    <div class="login-lado">
      <span class="logo-cuadro">DW</span>
      <h1>Tienda DW</h1>
      <p>Crea tu cuenta. Un administrador la revisará y la activará.</p>
    </div>

    <div class="login-form">
      <h2>Crear cuenta</h2>
      <p class="subtitulo">Solo necesitas un correo y una contraseña</p>

      <form id="formRegistro" novalidate>
        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" placeholder="Mínimo 6 caracteres">

        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" placeholder="Repite la contraseña">

        <button type="submit">Registrarme</button>
      </form>

      <p id="mensaje" class="mensaje"></p>

      <p class="texto-centro">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
    </div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
